# tune.py 탐색 공간 (berlin). 트랙 전체에 같이 쓰는 값과 장애물을 피하는 동안 쓰는 값만 학습한다.
# 트랙 구간·좌표별 값은 넣지 않는다 (최종 평가 규칙: 구간별 하드코딩은 대폭 감점).
# 구간에 따라 달라야 하는 것은 노드의 일반 규칙으로 처리하고, 그 규칙의 계수를 학습한다:
#   guide.max_curvature = 차 주변 레이스라인 곡률이 이 값보다 크면 guide 를 쉬고 레이스라인 그대로 (헤어핀 대응)
fixed:
  default: {guide.enable: true}
# "<default | obstacle>.<svg_mppi 파라미터>": [최소, 최대(, log)]
#   default.reference_sdf.reference_speed_scale = speed_scaling(0.5) 이 적용된 레이스라인 속도 전체에 곱하는 배율
#   obstacle.* = guide 가 장애물을 피하는 중일 때만 덮어쓰는 값
#   default.svg_mppi.lambda 는 solver 파라미터라 trial 시작 때 solver 를 한 번 새로 만든다
space:
  default.reference_sdf.reference_speed_scale: [0.8, 1.4]
  default.guide.max_curvature: [0.4, 1.2]
  default.guide.obs_clear_d: [0.35, 0.6]
  default.guide.w_prev: [0.5, 6.0]
  default.svg_mppi.lambda: [0.5, 2.0, log]
  obstacle.guide.speed_scale: [0.6, 1.0]
# 첫 trial 은 기준 설정
baseline:
  default.reference_sdf.reference_speed_scale: 1.0
  default.guide.max_curvature: 0.65
  default.guide.obs_clear_d: 0.45
  default.guide.w_prev: 2.0
  default.svg_mppi.lambda: 1.0
  obstacle.guide.speed_scale: 1.0
